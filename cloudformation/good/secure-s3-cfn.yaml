AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Compliant S3 bucket configuration — passes all S3 security rules.
  Demonstrates: KMS encryption, versioning, access logging, block-all-public-access,
  and intelligent tiering lifecycle. Use as a reference for compliant IaC.

Resources:

  # Dedicated logging bucket receives access logs from the main bucket
  S3AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-access-logs"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90
    DeletionPolicy: Delete

  # Main bucket: encrypted with KMS, versioning on, logging to dedicated bucket,
  # all public access blocked, intelligent tiering lifecycle
  SecureMainBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-secure-main"
      # S3-004: Server-side encryption with KMS
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      # S3-003: Versioning enabled for recovery from accidental deletes
      VersioningConfiguration:
        Status: Enabled
      # S3-005: Access logging to dedicated bucket
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: main-bucket-access/
      # S3-001, S3-002: All public access blocked
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Cost-optimized lifecycle: move to IA after 30 days, archive after 90
      IntelligentTieringConfigurations:
        - Id: AutoTiering
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 90
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
    DependsOn: S3AccessLogsBucket
    DeletionPolicy: Delete

Outputs:
  SecureBucketName:
    Description: Name of the compliant secure bucket
    Value: !Ref SecureMainBucket
  SecureBucketArn:
    Description: ARN of the compliant secure bucket
    Value: !GetAtt SecureMainBucket.Arn
  LogsBucketName:
    Description: Name of the access logs bucket
    Value: !Ref S3AccessLogsBucket
