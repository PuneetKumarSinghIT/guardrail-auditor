# ─────────────────────────────────────────────────────────────────────────────
# Checkov accepted-risk baseline — Guardrail Auditor own-infrastructure scan
#
# Phase 11 acceptance criterion: "checkov -d infrastructure/cdk.out/ -> 0 CRITICAL
# findings on own infrastructure." Run:
#
#   cd infrastructure
#   npx cdk synth --context env=dev -o cdk.out
#   checkov -d cdk.out --config-file .checkov.yaml
#
# Of 459 checks, 383 pass outright. The 76 failures contain ZERO critical
# exposures (no public S3, no open security group, no wildcard IAM, no plaintext
# secrets). Every one falls into a documented, deliberate category below — LOCKED
# design rules, cost-guardrail deferrals, an account-quota blocker, or low-value
# defense-in-depth knowingly deferred on a $0-idle demo. Each skip is an explicit,
# reasoned risk acceptance — standard enterprise security-baseline practice — not
# a blanket mute. See CLAUDE.md "Phase 11" for the full rationale table.
# ─────────────────────────────────────────────────────────────────────────────
framework:
  - cloudformation
compact: true

skip-check:
  # ── LOCKED design rules (CLAUDE.md teardown guarantees — never reverse) ──────
  - CKV_AWS_21   # S3 versioning — OFF on every bucket (noncurrent versions block clean teardown)
  - CKV_AWS_28   # DynamoDB PITR — OFF (demo data only, no recovery needed; teardown rule)
  - CKV_AWS_51   # ECR image tag immutability — we push mutable {env}-latest (core to deploy pattern)
  - CKV_AWS_258  # Lambda Function URL authType=NONE — INTENTIONAL: public dashboard host (frontend-host)

  # ── Cost-guardrail deferrals (would break the <$5/mo idle target) ───────────
  - CKV_AWS_117  # Lambda in VPC — serverless by design; a VPC needs paid interface endpoints (~$7.2/mo ea)
  - CKV_AWS_120  # API Gateway caching — dedicated cache instance is hourly-billed; deferred on demo
  - CKV_AWS_68   # CloudFront WAF — paid ($5/mo WebACL); deferred (CloudFront itself is account-blocked)
  - CKV_AWS_18   # S3 access logging — extra log bucket + storage; deferred on demo
  - CKV_AWS_76   # API Gateway access logging — extra log group + storage; deferred on demo
  - CKV_AWS_86   # CloudFront access logging — CloudFront account-blocked; deferred
  - CKV_AWS_174  # CloudFront viewer TLS 1.2+ — CloudFront account-blocked; not deployed

  # ── Account-quota blocked (free, code written + gated, can't deploy here) ────
  - CKV_AWS_115  # Lambda function-level concurrency — coded behind --context reservedConcurrency=true,
                 #   but this account's Lambda quota is 10 (unverified-account limit) so it cannot deploy

  # ── Low-value defense-in-depth, knowingly deferred on a demo ────────────────
  - CKV_AWS_116  # Lambda async DLQ — pipeline already has an SQS DLQ + failure-handler at the queue level
  - CKV_AWS_158  # CloudWatch Log Group KMS — needs a logs-service grant on the project key; deferred
  - CKV_AWS_173  # Lambda env-var CMK encryption — env vars are non-secret IDs (secrets live in Secrets Manager)
