name: 01 — PR Checks

on:
  pull_request:
    branches: [dev, staging, main]

permissions:
  id-token: write
  contents: read

jobs:
  python-tests:
    name: Python Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # no cache: pip — requires requirements.txt to exist; added back in Phase 4

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov moto[all] boto3
          for dir in scanner api ai-engine; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt"
            fi
          done

      - name: Run pytest with coverage
        run: |
          HAS_TESTS=false
          TEST_DIRS=""
          IGNORE_FLAGS=""
          for dir in scanner api ai-engine; do
            if [ -d "$dir/tests" ] && find "$dir/tests" -name "test_*.py" | grep -q .; then
              HAS_TESTS=true
              TEST_DIRS="$TEST_DIRS $dir/"
              # Ignore fixtures subdirs so binary files don't confuse pytest
              if [ -d "$dir/tests/fixtures" ]; then
                IGNORE_FLAGS="$IGNORE_FLAGS --ignore=$dir/tests/fixtures"
              fi
            fi
          done
          if [ "$HAS_TESTS" = "true" ]; then
            # Build --cov flags for each Lambda dir that has a src/ subdirectory
            COV_FLAGS=""
            for dir in scanner api ai-engine; do
              [ -d "$dir/src" ] && COV_FLAGS="$COV_FLAGS --cov=$dir/src"
            done
            pytest $TEST_DIRS \
              $COV_FLAGS \
              --cov-fail-under=70 \
              --cov-report=term-missing \
              -v \
              $IGNORE_FLAGS
          else
            echo "No test files found yet — skipping (Phase 4+ will add them)"
          fi

  cfn-lint:
    name: CloudFormation Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # no cache: pip — requires requirements.txt to exist; added back in Phase 3

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        run: |
          if [ -d "cloudformation" ] && find cloudformation/ -name "*.yaml" -o -name "*.json" 2>/dev/null | grep -q .; then
            cfn-lint cloudformation/**/*.yaml || true
          else
            echo "No CloudFormation templates found — skipping (Phase 3 will add them)"
          fi

  tfsec:
    # NOTE: the display name is kept as "(tfsec)" on purpose — the staging/main branch
    # rulesets require a status check with this exact context name. tfsec was ARCHIVED
    # by Aquasecurity in favour of Trivy (its install_linux.sh script is now dead, which
    # broke this job), so the step below runs Trivy's IaC misconfiguration scan instead.
    name: Terraform Security Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC misconfiguration scan (successor to deprecated tfsec)
        run: |
          if [ ! -d "terraform-examples" ]; then
            echo "terraform-examples/ not found — skipping (Phase 3 will add it)"
            exit 0
          fi
          # Trivy's install script is actively maintained (unlike tfsec's archived one).
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
          # config mode = IaC misconfiguration scan. --exit-code 0 so the INTENTIONAL
          # findings in terraform-examples/bad/ never fail the build (matches the old
          # tfsec --soft-fail behaviour). (--no-progress was removed in recent Trivy.)
          trivy config terraform-examples/ --exit-code 0

  checkov:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # no cache: pip — requires requirements.txt to exist; added back in Phase 3

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on IaC examples
        run: |
          if [ -d "cloudformation" ] || [ -d "terraform-examples" ]; then
            DIRS=""
            [ -d "cloudformation" ]      && DIRS="$DIRS --directory cloudformation"
            [ -d "terraform-examples" ]  && DIRS="$DIRS --directory terraform-examples"
            checkov $DIRS \
              --framework terraform,cloudformation \
              --soft-fail \
              --output cli \
              --compact \
              || true
          else
            echo "No IaC example directories found — skipping (Phase 3 will add them)"
          fi
        # soft-fail + || true: bad/ files have intentional findings; Phase 3 tunes --check flags
