name: AWS Deploy (OIDC)
description: Assumes GitHubActionsDeployRole via OIDC and configures AWS credentials

inputs:
  role-arn:
    description: IAM role ARN to assume
    required: true
  aws-region:
    description: AWS region
    required: true
    default: us-east-1

outputs:
  deploy-env:
    description: Resolved deployment environment (dev, staging, or prod)
    value: ${{ steps.resolve-env.outputs.deploy_env }}

runs:
  using: composite
  steps:
    - name: Resolve deployment environment
      id: resolve-env
      shell: bash
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
        else
          echo "deploy_env=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-${{ github.run_id }}
